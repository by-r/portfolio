services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    working_dir: /app
    environment:
      DEBUG: "True"
      HTTPS: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      RATE_LIMIT_TRUST_PROXY: "False"
    command:
      - sh
      - -c
      - >
        uv run --no-sync python manage.py migrate --noinput &&
        uv run --no-sync python manage.py seed_demo &&
        exec uv run --no-sync python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    working_dir: /app
    environment:
      # Allows frontend/vite.config.ts to find Django in Docker.
      VITE_API_PROXY_TARGET: http://web:8000
    depends_on:
      - web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_venv:
  frontend_node_modules:
