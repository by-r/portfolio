server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React/Vite SPA, including client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django collectstatic output shared from the web container.
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserve the HTTPS signal supplied by an outer TLS proxy.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Must match ADMIN_URL=staff/ unless you also update this location.
    location /staff/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
